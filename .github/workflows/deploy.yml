name: deploy

# Publishes dist/ to GitHub Pages.
#
# Safe to run on every push while the site is served from <owner>.github.io.
# Once the custom domain is attached, `public/CNAME` must exist again; GitHub
# Pages will then serve codex.is-a.dev and keep redirecting the github.io URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify.mjs
      - run: node scripts/check-assets.mjs
      - run: node scripts/check-seo.mjs
      - uses: actions/configure-pages@v5
        with:
          # Converts a branch-based Pages site to a workflow build if it is not
          # already one; harmless when the source is already GitHub Actions.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
