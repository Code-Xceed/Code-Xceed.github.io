name: deploy

# Dispatch-only on purpose.
#
# `public/CNAME` makes GitHub Pages claim `codex.is-a.dev` as soon as Pages is
# enabled, so a push-triggered deploy before the is-a.dev record exists would
# serve a domain that does not resolve. Once `codex.is-a.dev` points at
# `<owner>.github.io`, add:
#
#   push:
#     branches: [main]
#
# and every push to main will publish.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify.mjs
      - run: node scripts/check-assets.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
